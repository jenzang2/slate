<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLATE — 스토리보드 메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#12171A;
  --ink-2:#1D2529;
  --sage-50:#F6FAF6;
  --sage-100:#E9F1EA;
  --sage-200:#D8E7DC;
  --sage-300:#C3D8C9;
  --line:#DFE6E0;
  --line-2:#E9EEE9;
  --text:#101416;
  --muted:#6C7873;
  --faint:#A8B3AC;
  --tally:#E1503C;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--text);background:#E9EEE9;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;
}
button,input,select{font-family:inherit}
button{cursor:pointer}

/* ── 앱 바 ─────────────────────────────── */
.appbar{
  position:sticky;top:0;z-index:60;height:58px;
  background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:16px;padding:0 18px;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 8px 24px -18px rgba(0,0,0,.6);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:30px;height:30px;border-radius:7px;flex:0 0 auto;position:relative;overflow:hidden;
  background:repeating-linear-gradient(48deg,#fff 0 5px,#12171A 5px 10px);
  box-shadow:0 0 0 1px rgba(255,255,255,.22);
}
.mark::after{
  content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%;
  background:var(--tally);box-shadow:0 0 0 2px var(--ink);
}
.brand-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand-txt b{font:700 12px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;display:flex;align-items:center}
.bp{
  font-family:var(--sans);font-weight:800;letter-spacing:-.015em;text-transform:none;
  font-size:12.5px;padding-right:10px;margin-right:10px;border-right:1px solid rgba(255,255,255,.26);
}
.brand-txt span{font-size:11px;color:#8FA099;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.actions{display:flex;align-items:center;gap:7px}
.btn{
  border:1px solid rgba(255,255,255,.17);background:transparent;color:#E7EDE9;
  font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.btn:active{transform:translateY(1px)}
.btn svg{opacity:.85}
.btn.solid{background:#fff;color:var(--ink);border-color:#fff}
.btn.solid:hover{background:#EDF3EE;border-color:#EDF3EE}
.btn.ghost{border-color:transparent;color:#BAC7C0}
.vsep{width:1px;height:20px;background:rgba(255,255,255,.16);margin:0 3px}
.btn.ghost:hover{color:#fff;background:rgba(255,255,255,.07)}

/* ── 컨트롤 스트립 ─────────────────────── */
.controls{
  position:sticky;top:58px;z-index:55;
  background:#F8FBF8;border-bottom:1px solid var(--line);
  padding:11px 16px 12px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;
}
.group{display:flex;flex-direction:column;gap:5px;min-width:0}
.group>label{
  font:600 9.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:#86938C;
}
.row{display:flex;align-items:center;gap:6px}
.txt{
  background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;font-size:13px;font-weight:600;color:var(--text);
  outline:none;transition:.15s;min-width:0;
}
.txt:focus{border-color:var(--sage-300);box-shadow:0 0 0 3px #E4EFE7;background:#fff}
#pTitle{width:198px}
select.txt{padding-right:24px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236C7873' stroke-width='3'><path d='M5 9l7 7 7-7'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;font-size:12.5px}
.vdiv{width:1px;height:32px;background:var(--line);margin:0 2px}
.swatches{display:flex;gap:5px;align-items:center;padding-bottom:6px}
.sw{width:17px;height:17px;border-radius:50%;border:1px solid rgba(18,23,26,.16);padding:0;transition:.12s}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #4A5A52;transform:scale(1.04)}
.sizebar{display:flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px;height:31px;align-items:center}
.sizebar button{border:0;background:transparent;border-radius:5px;width:22px;height:23px;display:grid;place-items:center;padding:0}
.sizebar button[aria-pressed="true"]{background:#E8F0EA}
.sizebar i{display:block;border-radius:50%;background:#2B3631}
.toggle{
  display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:6px 10px 6px 8px;height:31px;font-size:12.5px;font-weight:600;color:#40504A;
}
.toggle .dot{width:26px;height:15px;border-radius:99px;background:#DDE5DE;position:relative;transition:.16s;flex:0 0 auto}
.toggle .dot::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.toggle[aria-pressed="true"]{border-color:var(--sage-300);background:#F3F9F4}
.toggle[aria-pressed="true"] .dot{background:#4E8A63}
.toggle[aria-pressed="true"] .dot::after{transform:translateX(11px)}
.stats{
  margin-left:0;display:flex;align-items:center;gap:8px;
  font:600 10.5px/1 var(--mono);letter-spacing:.05em;color:#5A6A62;
  background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 11px;height:31px;
  white-space:nowrap;min-width:0;
}
.stats b{color:var(--ink);font-weight:700}
.stats .apply{border:0;background:#EAF3EC;color:#3C6B4E;font:700 10px/1 var(--sans);padding:4px 7px;border-radius:99px;letter-spacing:0}
.stats .apply:hover{background:#DDEBDF}

/* ── 보드 / 시트 ───────────────────────── */
.board{padding:26px 18px 90px;display:flex;flex-direction:column;align-items:center;gap:26px}
.sheet{
  width:100%;max-width:1120px;position:relative;
  background:
    radial-gradient(120% 90% at 8% 0%,#F7FBF6 0%,rgba(247,251,246,0) 60%),
    linear-gradient(158deg,#F4F9F3 0%,#E6F0E9 44%,#EFF6EF 100%);
  border-radius:20px;padding:22px 22px 24px;
  box-shadow:0 1px 0 #fff inset,0 2px 3px rgba(18,23,26,.05),0 26px 50px -30px rgba(18,23,26,.45);
}
.sheet-head{position:relative;margin-bottom:16px}
.sheet-head h1{
  margin:0 0 15px;text-align:center;font-size:clamp(17px,2.1vw,25px);font-weight:800;
  letter-spacing:-.035em;color:#0E1512;outline:none;line-height:1.2;
}
.sheet-head h1:empty::before{content:attr(data-ph);color:#9DAEA5}
.sheet-head h1:focus{background:#fff8;border-radius:6px;box-shadow:0 0 0 4px #fff8}
.pg{position:absolute;right:0;top:1px;font:600 9.5px/1 var(--mono);letter-spacing:.16em;color:#8B9992}
.castrow{display:flex;gap:8px;margin-top:7px;align-items:flex-start}
.castrow .cl{padding-top:6px}
.cast{
  flex:1;min-width:0;height:40px;overflow:auto;background:#F2F8F3;border-radius:6px;
  padding:5px 10px;font-size:10.5px;line-height:1.55;font-weight:600;color:#1B2721;
  white-space:pre-wrap;word-break:break-word;outline:none;scrollbar-width:thin;
}
.cast:empty::before{content:attr(data-ph);color:#93A29A;font-weight:500}
.cast:focus{background:#fff;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #9EC2A9}
.credits{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.credit{display:flex;align-items:center;gap:6px;min-width:0}
.cl{
  font:800 9px/1 var(--sans);letter-spacing:.03em;color:#5A6A62;white-space:nowrap;flex:0 0 auto;
}
.cv{
  flex:1;min-width:0;background:var(--sage-200);border-radius:5px;height:25px;display:flex;
  align-items:center;padding:0 9px;font-size:11px;font-weight:700;color:#16211C;
  outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cv:empty::before{content:attr(data-ph);color:#7E9086;font-weight:600}
.cv:focus{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #9EC2A9;background:#fff}
.pg{left:0!important;right:auto!important}
.ml{display:block;font:700 9.5px/1 var(--sans);letter-spacing:.04em;color:#5E6D66;margin:0 0 5px 2px}
.mv{
  background:var(--sage-200);border-radius:6px;height:31px;display:flex;align-items:center;
  padding:0 11px;font-size:12.5px;font-weight:700;color:#16211C;letter-spacing:-.01em;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.mv:empty::before{content:attr(data-ph);color:#7E9086;font-weight:600}
.grid{display:grid;gap:11px}

/* ── 컷 카드 ───────────────────────────── */
.cut{
  background:#fff;border-radius:11px;padding:9px 9px 8px;display:flex;flex-direction:column;
  box-shadow:0 1px 1px rgba(18,23,26,.05),0 3px 8px -4px rgba(18,23,26,.16);
  transition:box-shadow .18s;
}
.cut:hover{box-shadow:0 1px 1px rgba(18,23,26,.05),0 8px 18px -8px rgba(18,23,26,.28)}
.cut-head{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px}
.num{
  background:#12171A;color:#fff;font:700 10.5px/1 var(--mono);letter-spacing:.05em;
  width:25px;height:22px;display:grid;place-items:center;border-radius:5px;flex:0 0 auto;
  font-variant-numeric:tabular-nums;
}
.shottitle{flex:1;min-width:0}
.ftitle{font-size:12.5px;font-weight:700;color:#0E1512;letter-spacing:-.015em;line-height:1.35}
.ftitle:empty::before{font-weight:600;color:#B3BEB7}
.lbl{display:block;font:800 9.5px/1 var(--sans);letter-spacing:.08em;color:#111A16;margin-bottom:3px}
.field{
  font-size:11px;line-height:1.5;color:#222B27;min-height:15px;white-space:pre-wrap;
  word-break:break-word;outline:none;border-radius:4px;padding:0 1px;transition:box-shadow .15s;
}
.field:empty::before{content:attr(data-ph);color:var(--faint);font-weight:400}
.field:focus{box-shadow:0 0 0 3px #E7F1E9;background:#F7FBF7}
.cut-tools{display:flex;gap:1px;opacity:0;transition:.15s;margin:-3px -3px 0 0}
.cut:hover .cut-tools,.cut:focus-within .cut-tools{opacity:1}
.cut-tools button{
  border:0;background:transparent;color:#7E8C85;width:19px;height:19px;border-radius:4px;
  display:grid;place-items:center;padding:0;
}
.cut-tools button:hover{background:#F0F5F1;color:#12171A}
.cut-tools button[data-act="del"]:hover{background:#FCEDEA;color:#C2412C}

.frame{
  margin-top:auto;position:relative;height:0;padding-bottom:56.25%;background:#fff;
  border:1px solid #DCE4DE;border-radius:5px;overflow:hidden;
}
.frame canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.frame .hint{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3px;
  text-align:center;font-size:9.5px;font-weight:600;color:#B3BEB7;pointer-events:none;padding:0 12px;
}
.frame .hint span{font-size:8.5px;font-weight:500;color:#C6D0C9}
.cut.has-ink .hint{display:none}
.frame-tools{
  position:absolute;left:6px;right:6px;bottom:6px;display:flex;align-items:center;gap:2px;
  padding:3px;background:rgba(255,255,255,.95);border:1px solid #E3E9E3;border-radius:6px;
  box-shadow:0 2px 8px rgba(18,23,26,.1);opacity:0;transform:translateY(3px);
  transition:.16s;pointer-events:none;
}
.frame:hover .frame-tools,.frame:focus-within .frame-tools{opacity:1;transform:none;pointer-events:auto}
.frame-tools button{
  border:0;background:transparent;color:#3E4A44;width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;padding:0;
}
.frame-tools button:hover{background:#EFF4EF}
.frame-tools button[aria-pressed="true"]{background:#E7F0E9;color:#1F3A2A}
.frame-tools .sep{width:1px;height:12px;background:#E4EAE4;margin:0 2px}

.shot{display:flex;gap:4px;margin-top:6px}
.shot[hidden]{display:none}
.shot select,.shot input{
  font-family:var(--sans);font-weight:600;font-size:9px;color:#42514A;background:#F4F8F4;
  border:1px solid #E3EAE4;border-radius:4px;padding:3px 3px;min-width:0;width:100%;outline:none;
}
.shot select{appearance:none;text-align:center}
.shot input{width:36px;flex:0 0 36px;text-align:center}

.screen{margin-top:6px;padding-top:6px;border-top:1px solid #EFF3EF}
.dlg{margin-top:5px;padding-top:5px;border-top:1px solid #EFF3EF}
.dlg .lbl{color:#2F4A38}
.dlgrows{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:start}
.dlgrow{display:contents}
.dlgspk,.dlgsay{
  font-size:11px;line-height:1.5;color:#1D2A23;white-space:pre-wrap;word-break:break-word;
  outline:none;border-radius:4px;min-height:16.5px;padding:0 1px;
  transition:box-shadow .15s,background .15s;
}
.dlgspk{font-weight:700;color:#2A4234;padding-right:7px;max-width:7.5em;border-right:1.5px solid #CFE0D5}
.dlgsay{padding-left:8px;font-weight:400}
.dlgspk:empty::before{content:attr(data-ph);color:#C4CFC8;font-weight:500}
.dlgsay:empty::before{content:attr(data-ph);color:var(--faint);font-weight:400}
.dlgspk:empty + .dlgsay{font-style:italic;color:#43524B}
.dlgspk:focus,.dlgsay:focus{box-shadow:0 0 0 3px #E7F1E9;background:#F7FBF7}
.etc{margin-top:5px;padding-top:5px;border-top:1px dashed #EEF2EE}
.etc .lbl{color:#7B8881;letter-spacing:.06em;font-weight:800;font-size:9px}
.etc .field{font-size:10.5px;color:#4A5852}
.addtile{
  border:1.5px dashed #B9CDBE;background:rgba(255,255,255,.5);border-radius:11px;
  display:grid;place-content:center;justify-items:center;gap:7px;min-height:96px;
  color:#4F7259;font-size:11.5px;font-weight:700;transition:.15s;padding:14px;align-self:stretch;
}
.addtile:hover{background:#fff;border-color:#84AC90;color:#22422F;box-shadow:0 6px 16px -10px rgba(18,23,26,.5)}
.addtile .plus{
  width:26px;height:26px;border-radius:50%;background:#E3EEE6;display:grid;place-items:center;
  font:700 16px/1 var(--sans);color:#3C6B4E;transition:.15s;
}
.addtile:hover .plus{background:#3C6B4E;color:#fff}
.addtile.wide{min-height:0;padding:13px 16px;grid-auto-flow:column;gap:9px;justify-content:center}
.addtile.wide .plus{width:22px;height:22px;font-size:14px}

/* ── 푸터 ─────────────────────────────── */
.foot{max-width:1120px;margin:0 auto;padding:0 18px 44px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.foot p{margin:0;font-size:11px;color:#7C8983;line-height:1.6;max-width:640px}
.foot kbd{font:600 10px/1 var(--mono);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:#4C5A53}
.foot .link{border:0;background:transparent;color:#3E6B4F;font-size:11.5px;font-weight:700;text-decoration:none;border-bottom:1px solid #B9D2C1;padding:0 0 2px;white-space:nowrap}
.flinks{display:flex;gap:16px;align-items:center;flex:0 0 auto}

/* ── 토스트 ───────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:200;
  background:#12171A;color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:9px;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:6px;height:6px;border-radius:50%;background:#7CC08E;display:block}

/* ── 프린트 ───────────────────────────── */
/* ── 프로젝트 모달 ─────────────────────── */
.modal{position:fixed;inset:0;z-index:300;background:rgba(11,16,14,.52);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:64px 16px 28px;overflow:auto}
.modal[hidden]{display:none}
.panel{width:100%;max-width:600px;background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 34px 70px -24px rgba(8,14,11,.6);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.panel-head{display:flex;align-items:center;gap:10px;padding:15px 16px 14px 18px;border-bottom:1px solid var(--line-2)}
.panel-head h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:7px}
.panel-head h2 em{font-style:normal;font:700 10px/1 var(--mono);letter-spacing:.08em;color:#5C8A6A;background:#EAF3EC;border-radius:99px;padding:4px 7px}
.px{border:0;background:#F1F6F2;width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:#5A6A62;flex:0 0 auto}
.px:hover{background:#E5EFE7;color:#12171A}
.plist{max-height:min(58vh,430px);overflow:auto;padding:7px}
.pitem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;transition:.12s;
  cursor:pointer;border:1px solid transparent}
.pitem:hover{background:#F6FAF6;border-color:#E7EFE8}
.pitem.on{background:#EDF5EE;border-color:#CFE3D4}
.pthumb{width:54px;height:32px;border-radius:5px;flex:0 0 auto;border:1px solid #E3EBE4;
  background:repeating-linear-gradient(135deg,#F2F7F3 0 5px,#EAF2EC 5px 10px);
  display:grid;place-content:center;text-align:center;font:700 8px/1.15 var(--mono);color:#7E948A;letter-spacing:.02em}
.pbody{flex:1;min-width:0}
.pname{font-size:13px;font-weight:700;color:#0F1613;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
.pmeta{font-size:10.5px;color:#8A968F;margin-top:3px;display:flex;align-items:center;gap:5px}
.pmeta .dot{width:3px;height:3px;border-radius:50%;background:#C3CEC7;display:block}
.pacts{display:flex;gap:1px;opacity:0;transition:.12s;flex:0 0 auto}
.pitem:hover .pacts,.pitem.on .pacts{opacity:1}
.pacts button{border:0;background:transparent;width:25px;height:25px;border-radius:6px;
  display:grid;place-items:center;color:#7C8A83}
.pacts button:hover{background:#EFF5F0;color:#12171A}
.pacts button[data-act="del"]:hover{background:#FCEDEA;color:#C2412C}
.panel-foot{padding:11px 16px;border-top:1px solid var(--line-2);background:#FAFDFA;display:flex;gap:8px;align-items:center}
.panel-foot .hint{font-size:10.5px;color:#8A968F;flex:1;line-height:1.45}
.pbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;color:#2B3A33;display:inline-flex;align-items:center;gap:6px}
.pbtn:hover{background:#F2F8F3;border-color:#CFE3D4}
.pbtn.dark{background:#12171A;color:#fff;border-color:#12171A}
.pbtn.dark:hover{background:#243430;border-color:#243430}

@media print{
  @page{size:A4 landscape;margin:6mm}
  html,body{background:#fff!important}
  * { -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important }
  .appbar,.controls,.foot,.toast{display:none!important}
  .board{padding:0!important;gap:0!important;display:block!important}
  .sheet{
    max-width:none!important;width:100%!important;border-radius:0!important;
    box-shadow:none!important;padding:4mm 5mm!important;
    break-after:page;page-break-after:always;min-height:calc(210mm - 12mm)!important;
    display:flex!important;flex-direction:column;
  }
  .sheet>.grid{margin-top:auto!important;margin-bottom:auto!important}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .cut-tools,.frame-tools,.shot[hidden],.addtile,.frame .hint{display:none!important}

<script>
(function(){
'use strict';

/* ── 상수 ─────────────────────────────── */
const KEY='storyboard-slate.v1';
const CW=800, CH=450;
const nid=()=>Math.random().toString(36).slice(2,9);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SIZES=['와이드','풀샷','미디엄','미디엄 클로즈업','클로즈업','익스트림 클로즈업','인서트','오버 더 숄더','투샷','POV'];
const MOVES=['고정','팬','틸트','달리','트래킹','핸드헬드','크레인','줌인','줌아웃','슬로우'];

const tool={color:'#12171A',size:5,eraser:false};
const todayKR=()=>{const d=new Date();return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';};
const blank=()=>({id:nid(),title:'',screen:'',dlg:[{s:'',t:''}],etc:'',canvas:null,size:'',move:'',sec:''});
const DEFAULTS=()=>({
  title:'',cast:'',director:'',ad:'',dop:'',staff:'',
  cols:3,rows:2,showShot:false,frames:Array.from({length:6},blank)
});

/* ── 아이콘 ───────────────────────────── */
const sv=(d,w=2)=>'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const I={
  left:sv('<path d="M19 12H5M11 6l-6 6 6 6"/>'),
  right:sv('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  copy:sv('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  trash:sv('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),
  img:sv('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-6 6"/>'),
  eraser:sv('<path d="M4 15l6-6 8 8-3 3H7z"/><path d="M10 9l4-4 8 8-4 4"/>',1.8),
  undo:sv('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
  clear:sv('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>',1.8),
  pen:sv('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',1.7)
};

/* ── 상태 ─────────────────────────────── */
/* 대사 줄 구조: {s:이름, t:대사} 배열. 옛 단일 문자열은 여기서 승계한다. */
function migrateDlg(dlg,legacy){
  if(Array.isArray(dlg)&&dlg.length){
    return dlg.map(r=>typeof r==='string'
      ? {s:'',t:r}
      : {s:String((r&&r.s)||''),t:String((r&&r.t)||'')});
  }
  const out=[];
  String(legacy||'').split('\n').forEach(raw=>{
    const line=raw.replace(/\s+$/,'');
    if(!line.trim()) return;
    let m=line.match(/^\s*\(([^)]{1,14})\)\s*(.+)$/);
    if(m){ out.push({s:m[1].trim(),t:m[2].trim()}); return; }
    m=line.match(/^\s*([^\s:：]{1,14})\s*[:：]\s*(.+)$/);
    if(m){ out.push({s:m[1].trim(),t:m[2].trim()}); return; }
    out.push({s:'',t:line.trim()});
  });
  return out.length?out:[{s:'',t:''}];
}

function normalize(s){
  const b=DEFAULTS();
  const out=Object.assign(b,s||{});
  out.frames=Array.isArray(s&&s.frames)&&s.frames.length?s.frames.map(f=>Object.assign(blank(),f)):b.frames;
  out.cols=Number(out.cols)||3; out.rows=Number(out.rows)||2;
  delete out.heading; delete out.runtime; delete out.date;
  if(out.cast===undefined) out.cast='';
  ['director','ad','dop','staff'].forEach(k=>{ if(out[k]===undefined) out[k]=''; });
  out.frames.forEach(f=>{
    if(f.audio!==undefined){ if(!f.title) f.title=f.audio; delete f.audio; }
    if(f.etc===undefined) f.etc='';
    f.dlg=migrateDlg(f.dlg,f.line);
    delete f.line;
  });
  return out;
}
/* ── 다중 프로젝트 저장소 ─────────────── */
const IDX_KEY='slate-index.v1', PROJ_PREFIX='slate-project.v1.';
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function readIndex(){
  try{
    const raw=localStorage.getItem(IDX_KEY); if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||!Array.isArray(o.items)||!o.items.length) return null;
    return o;
  }catch(e){ return null; }
}
function writeIndex(idx){ try{ localStorage.setItem(IDX_KEY,JSON.stringify(idx)); }catch(e){} }
function loadProjectData(id){
  try{
    const raw=localStorage.getItem(PROJ_PREFIX+id);
    return raw?normalize(JSON.parse(raw)):null;
  }catch(e){ return null; }
}
function saveProjectData(id,data){
  try{ localStorage.setItem(PROJ_PREFIX+id,JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function projName(d){ const t=((d&&d.title)||'').trim(); return t||'제목 없는 스토리보드'; }
function dropProjectData(id){ try{ localStorage.removeItem(PROJ_PREFIX+id); }catch(e){} }

function loadBootstrap(){
  const el=document.getElementById('slate-data');
  if(!el) return null;
  try{ return normalize(JSON.parse(el.textContent)); }catch(e){ return null; }
}
const embedded=loadBootstrap();
let index=readIndex();
let activeId=null;

if(!index){
  let first=null;
  try{
    const legacy=localStorage.getItem(KEY);
    if(legacy) first=normalize(JSON.parse(legacy));
  }catch(e){}
  if(!first) first=embedded||normalize({title:'유튜브 5" 티저'});
  const id=uid();
  saveProjectData(id,first);
  index={activeId:id,items:[{id:id,name:projName(first),updated:Date.now(),cuts:first.frames.length}]};
  writeIndex(index);
  try{ localStorage.removeItem(KEY); }catch(e){}
}else if(embedded){
  const pid=embedded.pid;
  const exist=pid&&index.items.find(it=>it.id===pid);
  if(exist){
    saveProjectData(pid,embedded);
    exist.name=projName(embedded); exist.updated=Date.now(); exist.cuts=embedded.frames.length;
    index.activeId=pid;
  }else{
    const id=pid||uid();
    saveProjectData(id,embedded);
    index.items.unshift({id:id,name:projName(embedded),updated:Date.now(),cuts:embedded.frames.length});
    index.activeId=id;
  }
  writeIndex(index);
}
activeId=index.activeId;
let state=loadProjectData(activeId)||normalize({});

/* 내보내기용 데이터 객체 */
function dataObj(){
  return {app:'slate',version:7,pid:activeId,title:state.title,cast:state.cast,
    director:state.director,ad:state.ad,dop:state.dop,staff:state.staff,
    cols:state.cols,rows:state.rows,showShot:state.showShot,frames:state.frames};
}
/* 현재 화면 + 내용을 하나의 HTML 파일로 굽기 */
function buildExportHTML(){
  const json=JSON.stringify(dataObj()).replace(/<\//g,'<\\/');
  let html=document.documentElement.outerHTML;
  html=html.replace(/<script type="application\/json" id="slate-data">[\s\S]*?<\/script>/,'');
  html=html.replace(/<head(\s[^>]*)?>/i, function(m){
    return m + '<script type="application/json" id="slate-data">' + json + '</' + 'script>';
  });
  return '<!doctype html>' + html;
}

let pendingCut=null;

/* ── 엘리먼트 ─────────────────────────── */
const board=$('#board'), stats=$('#stats'), toastEl=$('#toast'), toastMsg=$('#toastMsg');
const pTitle=$('#pTitle'), pLayout=$('#pLayout');
const shotToggle=$('#shotToggle'), imgFile=$('#imgFile'), jsonFile=$('#jsonFile');

/* ── 저장 ─────────────────────────────── */
let saveT=null;
function scheduleSave(){ clearTimeout(saveT); saveT=setTimeout(saveState,450); }
function saveState(){
  const ok=saveProjectData(activeId,state);
  const it=index.items.find(x=>x.id===activeId);
  if(it){ it.name=projName(state); it.updated=Date.now(); it.cuts=state.frames.length; }
  writeIndex(index);
  if(!ok) toast('브라우저 저장 공간이 가득 찼어요. ‘HTML로 저장’으로 파일을 내려받아 두세요.',5200);
}
let toastT=null;
function toast(msg,ms){
  toastMsg.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),ms||2200);
}

/* ── 미터 표시 동기화 ─────────────────── */
function syncCredits(){
  $$('[data-credit]').forEach(n=>{
    if(document.activeElement===n) return;
    n.textContent=state[n.dataset.credit]||'';
  });
  $$('[data-cast]').forEach(n=>{
    if(document.activeElement===n) return;
    n.textContent=state.cast||'';
  });
}
function syncToolUI(){
  $$('#swatches .sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===tool.color&&!tool.eraser)));
  $$('#sizebar button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.size)===Number(tool.size))));
  $$('.frame-tools button[data-act="erase"]').forEach(b=>b.setAttribute('aria-pressed',String(tool.eraser)));
}
function updateStats(){
  const n=state.frames.length;
  let sec=0;
  state.frames.forEach(f=>{const v=parseFloat(String(f.sec||'').replace(/[^\d.]/g,'')); if(!isNaN(v))sec+=v;});
  const mm=Math.floor(sec/60), ss=Math.round(sec%60);
  let html='<span><b>'+n+'</b> CUTS</span>';
  if(sec>0) html+='<span>·</span><span>총 <b>'+mm+':'+String(ss).padStart(2,'0')+'</b></span>';
  stats.innerHTML=html;
  stats._sec=sec;
}

/* ── 렌더 ─────────────────────────────── */
function perPage(){ return state.cols*state.rows; }

function sheetHeadHTML(i,total){
  const pg = total>1 ? '<span class="pg">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</span>' : '';
  const credit=(k,label)=>'<div class="credit"><span class="cl">'+label+'</span>'+
    '<div class="cv" contenteditable="true" spellcheck="false" data-credit="'+k+'" data-ph="이름"></div></div>';
  return '<div class="sheet-head">'+pg+
    '<h1 contenteditable="true" spellcheck="false" data-ph="프로젝트 제목을 입력하세요">'+esc(state.title)+'</h1>'+
    '<div class="credits">'+
      credit('director','연출')+credit('ad','조연출')+credit('dop','촬영감독')+credit('staff','스태프')+
    '</div>'+
    '<div class="castrow"><span class="cl">출연</span>'+
      '<div class="cast" contenteditable="true" spellcheck="false" data-cast="1" '+
        'data-ph="예) 핌 역 : 핌파닛   ·   유튜버 역 : 박예슬">'+esc(state.cast)+'</div>'+
    '</div></div>';
}

function options(list,val,ph){
  let h='<option value="">'+ph+'</option>';
  list.forEach(v=>{ h+='<option value="'+esc(v)+'"'+(v===val?' selected':'')+'>'+esc(v)+'</option>'; });
  return h;
}

/* ── 대사 줄 렌더 ─────────────────────── */
function cutFrame(cutEl){
  return state.frames.find(x=>x.id===(cutEl&&cutEl.dataset.id));
}
function renderDlg(cutEl){
  const f=cutFrame(cutEl), wrap=cutEl.querySelector('.dlgrows');
  if(!f||!wrap) return;
  if(!Array.isArray(f.dlg)||!f.dlg.length) f.dlg=[{s:'',t:''}];
  wrap.innerHTML=f.dlg.map((r,i)=>
    '<div class="dlgrow" data-i="'+i+'">'+
      '<div class="dlgspk" contenteditable="true" spellcheck="false" data-d="s" data-ph="이름"></div>'+
      '<div class="dlgsay" contenteditable="true" spellcheck="false" data-d="t" data-ph="대사 · 내레이션"></div>'+
    '</div>').join('');
  Array.from(wrap.children).forEach((row,i)=>{
    row.querySelector('.dlgspk').textContent=f.dlg[i].s||'';
    row.querySelector('.dlgsay').textContent=f.dlg[i].t||'';
  });
  syncDlgRow(cutEl);
}
function syncDlgRow(cutEl){
  const f=cutFrame(cutEl), dlg=cutEl.querySelector('.dlg');
  if(!f||!dlg) return;
  dlg.querySelectorAll('.dlgrow').forEach(row=>{
    const rec=f.dlg[Number(row.dataset.i)]||{s:'',t:''};
    row.dataset.empty=(rec.s||rec.t)?'0':'1';
  });
  dlg.dataset.off=f.dlg.some(r=>r.s||r.t)?'0':'1';
}

  el.className='cut'; el.dataset.id=f.id;
  el.innerHTML=
    '<div class="cut-head">'+
      '<span class="num">'+String(idx+1).padStart(2,'0')+'</span>'+
      '<div class="shottitle">'+
        '<div class="field ftitle" contenteditable="true" data-k="title" data-ph="샷 제목" spellcheck="false"></div>'+
      '</div>'+
      '<div class="cut-tools">'+
        '<button data-act="left" title="앞 컷으로">'+I.left+'</button>'+
        '<button data-act="right" title="뒤 컷으로">'+I.right+'</button>'+
        '<button data-act="dup" title="이 컷 복제">'+I.copy+'</button>'+
        '<button data-act="del" title="이 컷 삭제">'+I.trash+'</button>'+
      '</div>'+
    '</div>'+
    '<div class="frame">'+
      '<canvas width="'+CW+'" height="'+CH+'"></canvas>'+
      '<div class="hint">이미지 · 스케치<span>도구는 마우스를 올리면 나타납니다</span></div>'+
      '<div class="frame-tools">'+
        '<button data-act="img" title="사진 넣기">'+I.img+'</button>'+
        '<button data-act="erase" aria-pressed="false" title="지우개">'+I.eraser+'</button>'+
        '<span class="sep"></span>'+
        '<button data-act="undo" title="되돌리기">'+I.undo+'</button>'+
        '<button data-act="clear" title="이 프레임 비우기">'+I.clear+'</button>'+
      '</div>'+
    '</div>'+
    '<div class="shot"'+(state.showShot?'':' hidden')+'>'+
      '<select data-k="size">'+options(SIZES,f.size,'샷')+'</select>'+
      '<select data-k="move">'+options(MOVES,f.move,'무브')+'</select>'+
      '<input data-k="sec" inputmode="decimal" placeholder="초" value="'+esc(f.sec)+'">'+
    '</div>'+
    '<div class="screen"><span class="lbl">화면 설명</span>'+
      '<div class="field" contenteditable="true" data-k="screen" data-ph="배우의 행동이나 화면 연출에 관해 여기 자세히 적어보세요." spellcheck="false"></div>'+
    '</div>'+
    '<div class="dlg"><span class="lbl">대사</span>'+
      '<div class="dlgrows"></div>'+
    '</div>'+
    '<div class="etc"><span class="lbl">기타</span>'+
      '<div class="field" contenteditable="true" data-k="etc" data-ph="준비물 · 소품 · 로케이션 · 인원 등" spellcheck="false"></div>'+
    '</div>';

  el.querySelector('[data-k="title"]').textContent=f.title||'';
  el.querySelector('[data-k="screen"]').textContent=f.screen||'';
  renderDlg(el);
  el.querySelector('[data-k="etc"]').textContent=f.etc||'';
  initCanvas(el,f);

  /* 이미지 드래그&드롭 */
  const fr=el.querySelector('.frame');
  fr.addEventListener('dragover',ev=>{ev.preventDefault();fr.style.boxShadow='0 0 0 2px #7FB08A inset';});
  fr.addEventListener('dragleave',()=>{fr.style.boxShadow='';});
  fr.addEventListener('drop',ev=>{
    ev.preventDefault(); fr.style.boxShadow='';
    let file=null;
    try{
      const dt=ev.dataTransfer;
      file=dt&&dt.files&&dt.files.length?Array.from(dt.files).find(x=>x.type.indexOf('image/')===0):null;
      if(!file&&dt&&dt.items){
        for(const it of dt.items){ if(it.kind==='file'&&it.type.indexOf('image/')===0){ file=it.getAsFile(); break; } }
      }
    }catch(e){}
    if(file) putImage(el,f,file); else toast('이미지 파일을 놓아주세요');
  });
  return el;
}

function addTile(){
  const b=document.createElement('button');
  b.type='button'; b.className='addtile'; b.setAttribute('aria-label','컷 추가');
  b.innerHTML='<span class="plus">+</span><span>컷 추가</span>';
  b.addEventListener('click',()=>addCut());
  return b;
}

function renderBoard(){
  board.innerHTML='';
  const pp=perPage();
  const total=Math.max(1,Math.ceil(state.frames.length/pp));
  for(let p=0;p<total;p++){
    const sheet=document.createElement('section');
    sheet.className='sheet';
    sheet.innerHTML=sheetHeadHTML(p,total);
    const grid=document.createElement('div');
    grid.className='grid';
    grid.style.gridTemplateColumns='repeat('+state.cols+',minmax(0,1fr))';
    state.frames.slice(p*pp,(p+1)*pp).forEach((f,i)=>grid.appendChild(cardEl(f,p*pp+i)));
    if(p===total-1){
      const tile=addTile();
      const used=state.frames.slice(p*pp,(p+1)*pp).length;
      const rem=used%state.cols;
      if(rem===0){ tile.style.gridColumn='1 / -1'; tile.classList.add('wide'); }
      else if(rem<state.cols-1) tile.style.gridColumn='span '+(state.cols-rem);
      grid.appendChild(tile);
    }
    sheet.appendChild(grid);
    board.appendChild(sheet);
  }
  syncCredits(); syncToolUI(); updateStats();
}

/* ── 캔버스 ───────────────────────────── */
function initCanvas(art,f){
  const cv=art.querySelector('canvas');
  const ctx=cv.getContext('2d');
  ctx.lineCap='round'; ctx.lineJoin='round';
  const undo=[];
  const obj={cv:cv,ctx:ctx,undo:undo,f:f};
  art._cv=obj;

  if(f.canvas){
    const img=new Image();
    img.onload=()=>{ if(!art.isConnected)return; ctx.clearRect(0,0,CW,CH); ctx.drawImage(img,0,0,CW,CH); };
    img.src=f.canvas;
    art.classList.add('has-ink');
  }

  let drawing=false,last=null;
  const pos=ev=>{
    const r=cv.getBoundingClientRect();
    const scale=CW/Math.max(1,r.width);
    return {x:(ev.clientX-r.left)*scale,y:(ev.clientY-r.top)*(CH/Math.max(1,r.height)),s:scale};
  };
  const pushUndo=()=>{ undo.push(cv.toDataURL()); if(undo.length>12) undo.shift(); };
  obj.pushUndo=pushUndo;

  const commit=()=>{ f.canvas=cv.toDataURL('image/png'); art.classList.add('has-ink'); scheduleSave(); };

  cv.addEventListener('pointerdown',ev=>{
    if(ev.button!==0 && ev.pointerType==='mouse') return;
    ev.preventDefault();
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    pushUndo();
    drawing=true; last=pos(ev);
    ctx.fillStyle=tool.eraser?'#ffffff':tool.color;
    const w=Math.max(1,tool.size*last.s);
    ctx.beginPath(); ctx.arc(last.x,last.y,w/2,0,Math.PI*2); ctx.fill();
    art.classList.add('has-ink');
  });

  cv.addEventListener('pointermove',ev=>{
    if(!drawing) return;
    const p=pos(ev);
    ctx.strokeStyle=tool.eraser?'#ffffff':tool.color;
    ctx.lineWidth=Math.max(1,tool.size*p.s);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p;
  });

  const end=ev=>{
    if(!drawing) return;
    drawing=false;
    try{ cv.releasePointerCapture(ev.pointerId); }catch(e){}
    commit();
  };
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
}

function putImage(art,f,file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    if(!art._cv){ URL.revokeObjectURL(url); return; }
    const c=art._cv;
    c.pushUndo();
    c.ctx.save(); c.ctx.fillStyle='#fff'; c.ctx.fillRect(0,0,CW,CH); c.ctx.restore();
    const s=Math.max(CW/img.width,CH/img.height), w=img.width*s, h=img.height*s;
    c.ctx.drawImage(img,(CW-w)/2,(CH-h)/2,w,h);
    art.classList.add('has-ink');
    f.canvas=c.ctx.canvas.toDataURL('image/png');
    scheduleSave(); URL.revokeObjectURL(url);
  };
  img.onerror=()=>{ toast('이미지를 읽지 못했어요'); URL.revokeObjectURL(url); };
  img.src=url;
}

/* ── 상호작용 ─────────────────────────── */
const findFrame=id=>state.frames.find(f=>f.id===id);

board.addEventListener('click',ev=>{
  const cutBtn=ev.target.closest('.cut-tools button');
  if(cutBtn){
    const art=cutBtn.closest('.cut'), id=art.dataset.id, i=state.frames.findIndex(f=>f.id===id);
    const act=cutBtn.dataset.act;
    if(i<0) return;
    if(act==='left'&&i>0){ const t=state.frames[i-1]; state.frames[i-1]=state.frames[i]; state.frames[i]=t; renderBoard(); scheduleSave(); }
    else if(act==='right'&&i<state.frames.length-1){ const t=state.frames[i+1]; state.frames[i+1]=state.frames[i]; state.frames[i]=t; renderBoard(); scheduleSave(); }
    else if(act==='dup'){ const src=state.frames[i]; const cp=Object.assign({},src,{id:nid()}); state.frames.splice(i+1,0,cp); renderBoard(); scheduleSave(); toast('컷을 복제했어요'); }
    else if(act==='del'){
      const f=state.frames[i];
      const dirty=(f.title||f.screen||f.etc||f.canvas||f.sec||(f.dlg||[]).some(r=>r.s||r.t));
      if(dirty && !confirm('이 컷을 삭제할까요? 적어둔 내용과 그림이 함께 사라집니다.')) return;
      state.frames.splice(i,1);
      if(!state.frames.length) state.frames.push(blank());
      renderBoard(); scheduleSave();
    }
    return;
  }

  const fBtn=ev.target.closest('.frame-tools button');
  if(fBtn){
    const art=fBtn.closest('.cut'), f=findFrame(art.dataset.id), act=fBtn.dataset.act;
    if(!f||!art._cv) return;
    const c=art._cv;
    if(act==='img'){ pendingCut=art; imgFile.value=''; imgFile.click(); }
    else if(act==='erase'){ tool.eraser=!tool.eraser; syncToolUI(); }
    else if(act==='undo'){
      const snap=c.undo.pop();
      if(!snap){ toast('되돌릴 작업이 없어요'); return; }
      const im=new Image();
      im.onload=()=>{ c.ctx.clearRect(0,0,CW,CH); c.ctx.drawImage(im,0,0,CW,CH); f.canvas=snap; scheduleSave(); };
      im.src=snap;
    }
    else if(act==='clear'){
      if(f.canvas && !confirm('이 프레임의 그림과 사진을 모두 지울까요?')) return;
      c.undo.push(c.cv.toDataURL());
      c.ctx.clearRect(0,0,CW,CH);
      f.canvas=null; art.classList.remove('has-ink'); scheduleSave();
    }
    return;
  }

  const h1=ev.target.closest('.sheet-head h1');
  if(h1) h1.focus();
});

/* 대사 줄: Enter = 다음 줄, Backspace = 빈 줄 삭제 */
function addDlgRow(cutEl,afterIdx,focus){
  const f=cutFrame(cutEl);
  if(!f) return;
  f.dlg.splice(afterIdx+1,0,{s:'',t:''});
  renderDlg(cutEl); scheduleSave();
  const row=cutEl.querySelectorAll('.dlgrow')[afterIdx+1];
  if(!row) return;
  const cell=row.querySelector(focus==='s'?'.dlgspk':'.dlgsay');
  if(cell) cell.focus();
}
board.addEventListener('keydown',ev=>{
  if(ev.isComposing||ev.keyCode===229) return;
  const cell=ev.target.closest&&ev.target.closest('[data-d]');
  if(!cell) return;
  const cutEl=cell.closest('.cut'), row=cell.closest('.dlgrow'), f=cutFrame(cutEl);
  if(!f||!row) return;
  const i=Number(row.dataset.i);
  if(ev.key==='Enter'&&!ev.altKey&&!ev.ctrlKey&&!ev.metaKey){
    ev.preventDefault();
    if(cell.dataset.d==='s'){
      const say=row.querySelector('.dlgsay');
      if(say&&!say.textContent.trim()) say.focus();
      else addDlgRow(cutEl,i,'s');
    }else{
      addDlgRow(cutEl,i,'s');
    }
    return;
  }
  if(ev.key==='Backspace'&&cell.dataset.d==='s'){
    const spk=row.querySelector('.dlgspk'), say=row.querySelector('.dlgsay');
    if(spk.textContent.trim()||say.textContent.trim()) return;
    if(f.dlg.length<2) return;
    ev.preventDefault();
    f.dlg.splice(i,1);
    renderDlg(cutEl); scheduleSave();
    const prev=cutEl.querySelectorAll('.dlgrow')[Math.max(0,i-1)];
    if(prev) prev.querySelector('.dlgsay').focus();
  }
});

board.addEventListener('input',ev=>{
  const h1=ev.target.closest('.sheet-head h1');
  if(h1){
    state.title=h1.textContent;
    pTitle.value=state.title;
    $$('.sheet-head h1').forEach(n=>{ if(n!==h1) n.textContent=state.title; });
    scheduleSave(); return;
  }
  const cst=ev.target.closest('[data-cast]');
  if(cst){
    state.cast=cst.textContent;
    $$('[data-cast]').forEach(n=>{ if(n!==cst) n.textContent=state.cast; });
    scheduleSave(); return;
  }
  const cr=ev.target.closest('[data-credit]');
  if(cr){
    state[cr.dataset.credit]=cr.textContent;
    $$('[data-credit="'+cr.dataset.credit+'"]').forEach(n=>{ if(n!==cr) n.textContent=state[cr.dataset.credit]; });
    scheduleSave(); return;
  }
  const dcell=ev.target.closest('[data-d]');
  if(dcell){
    const art=dcell.closest('.cut'), f=cutFrame(art);
    if(f){
      const i=Number(dcell.closest('.dlgrow').dataset.i);
      if(!f.dlg[i]) f.dlg[i]={s:'',t:''};
      f.dlg[i][dcell.dataset.d]=dcell.textContent;
      syncDlgRow(art); scheduleSave();
    }
    return;
  }
  const fld=ev.target.closest('.field');
  if(fld){
    const f=findFrame(fld.closest('.cut').dataset.id);
    if(f){ f[fld.dataset.k]=fld.textContent; scheduleSave(); }
  }
});

board.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-k]');
  if(!el||el.classList.contains('field')) return;
  const f=findFrame(el.closest('.cut').dataset.id);
  if(!f) return;
  f[el.dataset.k]=el.value;
  scheduleSave(); updateStats();
});

/* 이미지 파일 */
imgFile.addEventListener('change',()=>{
  const file=imgFile.files && imgFile.files[0];
  if(!file||!pendingCut) return;
  const f=findFrame(pendingCut.dataset.id);
  if(f) putImage(pendingCut,f,file);
  pendingCut=null;
});

/* 툴바 */
function addCut(afterId){
  const nb=blank();
  if(afterId){
    const i=state.frames.findIndex(f=>f.id===afterId);
    state.frames.splice(i+1,0,nb);
  } else state.frames.push(nb);
  renderBoard(); scheduleSave();
  const last=board.querySelector('.cut:last-child');
  if(last) last.scrollIntoView({behavior:'smooth',block:'center'});
  return nb;
}
$('#btnAdd').addEventListener('click',()=>addCut());

pTitle.value=state.title;
pTitle.addEventListener('input',()=>{
  state.title=pTitle.value; syncCredits();
  $$('.sheet-head h1').forEach(n=>{ if(document.activeElement!==n) n.textContent=state.title; });
  scheduleSave();
});



pLayout.value=state.cols+'x'+state.rows;
pLayout.addEventListener('change',()=>{
  const v=pLayout.value.split('x');
  state.cols=Number(v[0])||3; state.rows=Number(v[1])||2;
  renderBoard(); scheduleSave();

/* JSON 저장 / 불러오기 */
function stamp(){
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
}
function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

$('#btnExport').addEventListener('click',()=>{
  saveState();
  const html=buildExportHTML();
  download(new Blob([html],{type:'text/html'}),'storyboard-'+stamp()+'.html');
  toast('내용이 담긴 HTML 파일을 저장했어요 — 이 파일 하나만 옮기면 됩니다',4200);
});

$('#btnSave').addEventListener('click',()=>{
  const data=dataObj();
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const name='storyboard-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json';
  download(new Blob([JSON.stringify(data)],{type:'application/json'}),name);
  toast('프로젝트 파일을 저장했어요');
});
$('#btnLoad').addEventListener('click',()=>{ jsonFile.value=''; jsonFile.click(); });
jsonFile.addEventListener('change',()=>{
  const file=jsonFile.files && jsonFile.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const s=JSON.parse(rd.result);
      const loaded=normalize(s);
      saveState();
      const nid2=uid();
      saveProjectData(nid2,loaded);
      index.items.unshift({id:nid2,name:projName(loaded),updated:Date.now(),cuts:loaded.frames.length});
      index.activeId=nid2; writeIndex(index);
      activeId=nid2; state=loaded; applyState();
      toast('불러왔어요 — 새 스토리보드로 추가했습니다');
    }catch(e){ toast('파일을 읽지 못했어요. SLATE에서 저장한 JSON인지 확인해 주세요.',4000); }
  };
  rd.readAsText(file);
});

/* ── 프로젝트 관리 ───────────────────── */
const projModal=$('#projects'), plistEl=$('#plist'), plCount=$('#plCount');

function relTime(ts){
  if(!ts) return '저장 기록 없음';
  const d=new Date(ts), n=new Date();
  const pad=v=>String(v).padStart(2,'0');
  const y=new Date(n.getTime()-864e5);
  if(d.toDateString()===n.toDateString()) return '오늘 '+pad(d.getHours())+':'+pad(d.getMinutes());
  if(d.toDateString()===y.toDateString()) return '어제';
  return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());
}
function applyState(){
  pTitle.value=state.title||'';
  pLayout.value=state.cols+'x'+state.rows;
  shotToggle.setAttribute('aria-pressed',String(!!state.showShot));
  renderBoard();
}
function renderProjects(){
  const items=index.items.slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
  plCount.textContent=String(items.length);
  plistEl.innerHTML='';
  items.forEach(it=>{
    const on=it.id===activeId;
    const row=document.createElement('div');
    row.className='pitem'+(on?' on':'');
    row.dataset.id=it.id;
    row.innerHTML=
      '<div class="pthumb">'+(it.cuts||0)+'<br>CUT</div>'+
      '<div class="pbody">'+
        '<div class="pname">'+esc(it.name)+'</div>'+
        '<div class="pmeta">'+(on?'<span style="color:#3C6B4E;font-weight:700">열림</span><span class="dot"></span>':'')+
          relTime(it.updated)+'<span class="dot"></span>'+(it.cuts||0)+'컷</div>'+
      '</div>'+
      '<div class="pacts">'+
        '<button data-act="ren" title="이름 변경">'+I.pen+'</button>'+
        '<button data-act="dup" title="복제">'+I.copy+'</button>'+
        '<button data-act="del" title="삭제">'+I.trash+'</button>'+
      '</div>';
    plistEl.appendChild(row);
  });
}
function openProjects(){ saveState(); renderProjects(); projModal.hidden=false; document.body.style.overflow='hidden'; }
function closeProjects(){ projModal.hidden=true; document.body.style.overflow=''; }

function switchProject(id){
  if(id===activeId){ closeProjects(); return; }
  saveState();
  const d=loadProjectData(id);
  if(!d){ toast('이 스토리보드를 열지 못했어요'); return; }
  activeId=id; index.activeId=id; writeIndex(index);
  state=d; applyState(); closeProjects();
  window.scrollTo({top:0,behavior:'smooth'});
  toast('‘'+projName(state)+'’ 열었어요');
}
function newProject(seed){
  saveState();
  const d=normalize(Object.assign({title:''},seed||{}));
  const id=uid();
  saveProjectData(id,d);
  index.items.unshift({id:id,name:projName(d),updated:Date.now(),cuts:d.frames.length});
  index.activeId=id; writeIndex(index);
  activeId=id; state=d; applyState(); closeProjects();
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>{ pTitle.focus(); pTitle.select(); },120);
  toast('새 스토리보드를 열었어요 — 제목을 입력하세요');
}

$('#btnProjects').addEventListener('click',openProjects);
$('#btnNewProject').addEventListener('click',()=>newProject());
$('#plNew').addEventListener('click',()=>newProject());

projModal.addEventListener('click',ev=>{
  if(ev.target.closest('[data-close]')||ev.target===projModal){ closeProjects(); return; }
  const btn=ev.target.closest('.pacts button');
  const row=ev.target.closest('.pitem');
  if(!row) return;
  const id=row.dataset.id;
  const it=index.items.find(x=>x.id===id);
  if(!it) return;
  if(btn){
    const act=btn.dataset.act;
    if(act==='ren'){
      const nv=prompt('스토리보드 이름',it.name);
      if(nv===null) return;
      const nm=nv.trim(); if(!nm) return;
      it.name=nm;
      const d=loadProjectData(id);
      if(d){ d.title=nm; saveProjectData(id,d); if(id===activeId){ state.title=nm; pTitle.value=nm; } }
      writeIndex(index); renderProjects();
      return;
    }
    if(act==='dup'){
      const src=loadProjectData(id);
      if(!src){ toast('복제할 내용을 읽지 못했어요'); return; }
      const nid2=uid();
      const cp=normalize(JSON.parse(JSON.stringify(src)));
      cp.title=(src.title||'제목 없는 스토리보드')+' (사본)';
      cp.frames.forEach(f=>f.id=Math.random().toString(36).slice(2,9));
      saveProjectData(nid2,cp);
      index.items.unshift({id:nid2,name:projName(cp),updated:Date.now(),cuts:cp.frames.length});
      writeIndex(index); renderProjects();
      toast('복제했어요');
      return;
    }
    if(act==='del'){
      if(index.items.length<=1){ toast('마지막 스토리보드는 삭제할 수 없어요'); return; }
      if(!confirm('‘'+it.name+'’을(를) 삭제할까요? 되돌릴 수 없습니다.')) return;
      index.items=index.items.filter(x=>x.id!==id);
      dropProjectData(id);
      if(activeId===id){
        activeId=index.items[0].id;
        index.activeId=activeId;
        state=loadProjectData(activeId)||normalize({});
        applyState();
      }
      writeIndex(index); renderProjects();
      toast('삭제했어요');
      return;
    }
    return;
  }
  switchProject(id);
});

/* 초기화 */
$('#btnReset').addEventListener('click',()=>{
  if(!confirm('이 스토리보드의 모든 컷과 그림을 지울까요? 되돌릴 수 없습니다.')) return;
  const keepName=state.title;
  state=normalize({title:keepName});
  pTitle.value=state.title;
  pLayout.value='3x2'; shotToggle.setAttribute('aria-pressed','false');
  renderBoard(); saveState(); toast('이 프로젝트를 비웠어요');
});

$('#btnSample').addEventListener('click',()=>{
  while(state.frames.length<6) state.frames.push(blank());
  SAMPLE.forEach((s,i)=>{
    const f=state.frames[i];
    f.title=s.t; f.screen=s.s; f.etc=s.e; f.size=s.z; f.move=s.m; f.sec=s.d;
    f.dlg=(Array.isArray(s.l)&&s.l.length?s.l:[{s:'',t:''}]).map(r=>({s:r.s||'',t:r.t||''}));
  });
  if(!state.cast) state.cast='핌 역 : 핌파닛\n유튜버 역 : 박예슬';
  renderBoard(); scheduleSave(); toast('예시 6컷을 채웠어요 — 내용을 고쳐 쓰세요');
});

/* 단축키 */
document.addEventListener('keydown',ev=>{
  if(ev.altKey && (ev.key==='n'||ev.key==='N')){ ev.preventDefault(); addCut(); }
  if((ev.ctrlKey||ev.metaKey) && (ev.key==='s'||ev.key==='S')){ ev.preventDefault(); $('#btnSave').click(); }
  if((ev.ctrlKey||ev.metaKey) && !ev.altKey && (ev.key==='o'||ev.key==='O')){ ev.preventDefault(); openProjects(); }
  if(ev.ctrlKey&&ev.altKey&&(ev.key==='n'||ev.key==='N')){ ev.preventDefault(); newProject(); }
  if(ev.key==='Escape' && !projModal.hidden){ closeProjects(); }
  if(ev.key==='Escape'){ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
});

/* 시작 */
applyState();
})();
